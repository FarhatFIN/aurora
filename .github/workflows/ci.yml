name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly full tier (§8.8)

jobs:
  fast:
    name: fast tier (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest] # §3.5 tier-1 platforms
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fast tier (§8.8)
        run: bash scripts/test-fast.sh

  full:
    name: full tier (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: full tier (§8.8)
        run: bash scripts/test-all.sh
