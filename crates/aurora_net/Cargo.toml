[package]
name = "aurora_net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP/1.1 client: redirects, chunked, decoding, sniffing (§5.2)"
publish = false

# Tier 0 — owned (§3.2): HTTP/1.1 semantics, chunked decoding, redirects,
# pooling, and sniffing are written here. The three Tier 1 crates below are
# pre-approved by §3.3 with their one-line justifications.
[dependencies]
aurora_url = { path = "../aurora_url" }
# rustls: TLS 1.2/1.3 client — §5.3 delegates TLS to the approved crate; all
# HTTP semantics stay owned. The `ring` provider avoids a cmake dependency.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# webpki-roots: hermetic trust store default (§7.3 risk mitigation).
webpki-roots = "1"
# flate2: gzip/deflate content decoding until the owned inflate lands
# (§6.9 item 7 explicitly permits this crate until then).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# none yet: the mock server harness uses std::net only.

[lints]
workspace = true
